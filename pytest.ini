# pytest.ini - pytest-watch configuration
# This file exists for pytest-watch compatibility (it can't parse TOML)
# Duplicates key settings from pyproject.toml for pytest-watch
[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Fast unit tests with no external dependencies
    integration: Integration tests with TestClient or external services
    e2e: End-to-end tests with full stack
    slow: Tests that take >1 second

# Default options (duplicated from pyproject.toml)
addopts = -ra --cov=app --cov-report=term-missing
