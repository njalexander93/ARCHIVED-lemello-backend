name: Linear Automation

on:
  create:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

env:
  LINEAR_STATE_FAILED_CI_ID: ${{ vars.LINEAR_STATE_FAILED_CI_ID }}
  LINEAR_STATE_DONE_ID: ${{ vars.LINEAR_STATE_DONE_ID }}
  LINEAR_STATE_STAGING_ID: ${{ vars.LINEAR_STATE_STAGING_ID }}
  LINEAR_STATE_IN_PROGRESS_ID: ${{ vars.LINEAR_STATE_IN_PROGRESS_ID }}
  LINEAR_STATE_RELEASE_ID: ${{ vars.LINEAR_STATE_RELEASE_ID }}

jobs:
  branch-created-to-in-progress:
    name: Branch Created -> In Progress
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Move issue from Backlog/Planned/Failed CI to In Progress
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not set; skipping."
            exit 0
          fi
          if [ -z "${LINEAR_STATE_IN_PROGRESS_ID:-}" ]; then
            echo "LINEAR_STATE_IN_PROGRESS_ID is not set."
            exit 1
          fi

          extract_keys() {
            local input="$1"
            printf "%s\n" "$input" \
              | (grep -oiE 'LMLO-[0-9]+' || true) \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          linear_issue_by_identifier() {
            local identifier="$1"
            local payload response issue_id error_count

            payload="$(jq -n --arg identifier "$identifier" '{query: "query($identifier: String!) { issue(identifier: $identifier) { id identifier state { id name } } }", variables: {identifier: $identifier}}')"
            response="$(
              curl -sS --fail-with-body https://api.linear.app/graphql \
                -H "Authorization: ${LINEAR_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$payload"
            )"
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "Linear returned invalid JSON for issue lookup: ${identifier}" >&2
              return 1
            fi
            error_count="$(echo "$response" | jq -r '.errors | length // 0')"
            if [ "${error_count}" != "0" ]; then
              echo "Linear lookup failed for ${identifier}." >&2
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' >&2 || true
              return 1
            fi
            issue_id="$(echo "$response" | jq -r '.data.issue.id // empty')"
            if [ -n "$issue_id" ]; then
              echo "$response"
              return 0
            fi
            echo "$response"
          }

          linear_update_state() {
            local issue_id="$1"
            local state_id="$2"
            local payload response success
            if [ -z "${state_id:-}" ]; then
              echo "State ID is empty for issue ${issue_id}."
              return 1
            fi
            payload="$(jq -n --arg issue_id "$issue_id" --arg state_id "$state_id" '{query: "mutation($issue_id: String!, $state_id: String!) { issueUpdate(id: $issue_id, input: { stateId: $state_id }) { success } }", variables: {issue_id: $issue_id, state_id: $state_id}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.issueUpdate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear issueUpdate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          mapfile -t KEYS < <(extract_keys "${BRANCH_NAME}" || true)
          if [ "${#KEYS[@]}" -eq 0 ]; then
            echo "No LMLO key found in branch '${BRANCH_NAME}'."
            exit 0
          fi

          for key in "${KEYS[@]}"; do
            issue_json="$(linear_issue_by_identifier "$key")"
            issue_id="$(echo "$issue_json" | jq -r '.data.issue.id // empty')"
            current_state_name="$(echo "$issue_json" | jq -r '.data.issue.state.name // empty')"

            if [ -z "$issue_id" ]; then
              echo "Issue ${key} not found in Linear; skipping."
              continue
            fi

            case "$current_state_name" in
              "Backlog"|"Planned"|"Failed CI")
                echo "Moving ${key} to In Progress."
                # Intentionally fail-fast if state mutation fails.
                linear_update_state "$issue_id" "${LINEAR_STATE_IN_PROGRESS_ID}"
                ;;
              *)
                echo "Skipping ${key}; current state is '${current_state_name}'."
                ;;
            esac
          done

  push-main-to-done-or-staging:
    name: Merge to Main -> Done or Staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Move issues and add merge commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not set; skipping."
            exit 0
          fi
          if [ -z "${LINEAR_STATE_DONE_ID:-}" ] || [ -z "${LINEAR_STATE_STAGING_ID:-}" ]; then
            echo "LINEAR_STATE_DONE_ID and/or LINEAR_STATE_STAGING_ID is not set."
            exit 1
          fi

          extract_keys() {
            local input="$1"
            if [ -z "$input" ]; then
              return 0
            fi
            printf "%s\n" "$input" \
              | (grep -oiE 'LMLO-[0-9]+' || true) \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          linear_issue_by_identifier() {
            local identifier="$1"
            local payload response issue_id error_count

            payload="$(jq -n --arg identifier "$identifier" '{query: "query($identifier: String!) { issue(identifier: $identifier) { id } }", variables: {identifier: $identifier}}')"
            response="$(
              curl -sS --fail-with-body https://api.linear.app/graphql \
                -H "Authorization: ${LINEAR_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$payload"
            )"
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "Linear returned invalid JSON for issue lookup: ${identifier}" >&2
              return 1
            fi
            error_count="$(echo "$response" | jq -r '.errors | length // 0')"
            if [ "${error_count}" != "0" ]; then
              echo "Linear lookup failed for ${identifier}." >&2
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' >&2 || true
              return 1
            fi
            issue_id="$(echo "$response" | jq -r '.data.issue.id // empty')"
            if [ -n "$issue_id" ]; then
              echo "$response"
              return 0
            fi
            echo "$response"
          }

          linear_update_state() {
            local issue_id="$1"
            local state_id="$2"
            local payload response success
            if [ -z "${state_id:-}" ]; then
              echo "State ID is empty for issue ${issue_id}."
              return 1
            fi
            payload="$(jq -n --arg issue_id "$issue_id" --arg state_id "$state_id" '{query: "mutation($issue_id: String!, $state_id: String!) { issueUpdate(id: $issue_id, input: { stateId: $state_id }) { success } }", variables: {issue_id: $issue_id, state_id: $state_id}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.issueUpdate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear issueUpdate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          linear_comment() {
            local issue_id="$1"
            local body="$2"
            local payload response success
            payload="$(jq -n --arg issue_id "$issue_id" --arg body "$body" '{query: "mutation($issue_id: String!, $body: String!) { commentCreate(input: { issueId: $issue_id, body: $body }) { success } }", variables: {issue_id: $issue_id, body: $body}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.commentCreate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear commentCreate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          is_release_path() {
            local path="$1"
            # Matches build-and-release "release_paths" in release.yml.
            if [[ "$path" =~ ^app/ ]]; then
              return 0
            fi
            case "$path" in
              pyproject.toml|Dockerfile|uv.lock)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          PR_NUMBER="$(gh api "repos/${REPO}/commits/${MERGE_SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR associated with merge commit ${MERGE_SHA}; skipping."
            exit 0
          fi

          PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || {
            echo "Failed to fetch PR details for #${PR_NUMBER}; skipping."
            exit 0
          }
          PR_HEAD_REF="$(echo "${PR_JSON}" | jq -r '.head.ref // empty')"
          PR_TITLE="$(echo "${PR_JSON}" | jq -r '.title // empty')"
          PR_BODY="$(echo "${PR_JSON}" | jq -r '.body // empty')"

          mapfile -t KEYS < <(
            {
              extract_keys "${PR_HEAD_REF}"
              extract_keys "${PR_TITLE}"
              extract_keys "${PR_BODY}"
            } | sort -u
          )

          if [ "${#KEYS[@]}" -eq 0 ]; then
            echo "No LMLO keys found in PR #${PR_NUMBER}; skipping."
            exit 0
          fi

          RELEASE_TRIGGERED="false"
          PR_FILES_RAW="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' 2>/dev/null)" || {
            echo "Warning: Failed to fetch files for PR #${PR_NUMBER}; defaulting to Done."
            PR_FILES_RAW=""
          }
          if [ -n "${PR_FILES_RAW}" ]; then
            while IFS= read -r file_path; do
              if is_release_path "$file_path"; then
                RELEASE_TRIGGERED="true"
                break
              fi
            done <<< "${PR_FILES_RAW}"
          fi

          TARGET_STATE_ID="${LINEAR_STATE_DONE_ID}"
          TARGET_STATE_NAME="Done"
          if [ "${RELEASE_TRIGGERED}" = "true" ]; then
            TARGET_STATE_ID="${LINEAR_STATE_STAGING_ID}"
            TARGET_STATE_NAME="Staging"
          fi

          COMMIT_URL="https://github.com/${REPO}/commit/${MERGE_SHA}"
          COMMENT_BODY="Merged to \`main\`: ${COMMIT_URL}"

          for key in "${KEYS[@]}"; do
            # Intentionally fail-fast if state/comment mutations fail.
            issue_json="$(linear_issue_by_identifier "$key")"
            issue_id="$(echo "$issue_json" | jq -r '.data.issue.id // empty')"
            if [ -z "$issue_id" ]; then
              echo "Issue ${key} not found in Linear; skipping."
              continue
            fi
            echo "Moving ${key} to ${TARGET_STATE_NAME}."
            linear_update_state "$issue_id" "${TARGET_STATE_ID}"
            linear_comment "$issue_id" "${COMMENT_BODY}"
          done

  release-published-to-release:
    name: Release Published -> Release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Move issues to Release and add release URL comment
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not set; skipping."
            exit 0
          fi
          if [ -z "${LINEAR_STATE_RELEASE_ID:-}" ]; then
            echo "LINEAR_STATE_RELEASE_ID is not set."
            exit 1
          fi

          extract_keys() {
            local input="$1"
            if [ -z "$input" ]; then
              return 0
            fi
            printf "%s\n" "$input" \
              | (grep -oiE 'LMLO-[0-9]+' || true) \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          linear_issue_by_identifier() {
            local identifier="$1"
            local payload response issue_id error_count

            payload="$(jq -n --arg identifier "$identifier" '{query: "query($identifier: String!) { issue(identifier: $identifier) { id } }", variables: {identifier: $identifier}}')"
            response="$(
              curl -sS --fail-with-body https://api.linear.app/graphql \
                -H "Authorization: ${LINEAR_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$payload"
            )"
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "Linear returned invalid JSON for issue lookup: ${identifier}" >&2
              return 1
            fi
            error_count="$(echo "$response" | jq -r '.errors | length // 0')"
            if [ "${error_count}" != "0" ]; then
              echo "Linear lookup failed for ${identifier}." >&2
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' >&2 || true
              return 1
            fi
            issue_id="$(echo "$response" | jq -r '.data.issue.id // empty')"
            if [ -n "$issue_id" ]; then
              echo "$response"
              return 0
            fi
            echo "$response"
          }

          linear_update_state() {
            local issue_id="$1"
            local state_id="$2"
            local payload response success
            if [ -z "${state_id:-}" ]; then
              echo "State ID is empty for issue ${issue_id}."
              return 1
            fi
            payload="$(jq -n --arg issue_id "$issue_id" --arg state_id "$state_id" '{query: "mutation($issue_id: String!, $state_id: String!) { issueUpdate(id: $issue_id, input: { stateId: $state_id }) { success } }", variables: {issue_id: $issue_id, state_id: $state_id}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.issueUpdate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear issueUpdate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          linear_comment() {
            local issue_id="$1"
            local body="$2"
            local payload response success
            payload="$(jq -n --arg issue_id "$issue_id" --arg body "$body" '{query: "mutation($issue_id: String!, $body: String!) { commentCreate(input: { issueId: $issue_id, body: $body }) { success } }", variables: {issue_id: $issue_id, body: $body}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.commentCreate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear commentCreate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          tag_ref_json="$(gh api "repos/${REPO}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)" || {
            echo "Failed to fetch tag ref for ${RELEASE_TAG}; skipping."
            exit 0
          }
          tag_object_type="$(echo "${tag_ref_json}" | jq -r '.object.type')"
          tag_object_sha="$(echo "${tag_ref_json}" | jq -r '.object.sha')"

          if [ "${tag_object_type}" = "tag" ]; then
            release_commit_sha="$(gh api "repos/${REPO}/git/tags/${tag_object_sha}" --jq '.object.sha' 2>/dev/null)" || {
              echo "Failed to resolve annotated tag ${RELEASE_TAG}; skipping."
              exit 0
            }
          else
            release_commit_sha="${tag_object_sha}"
          fi

          PR_NUMBER="$(gh api "repos/${REPO}/commits/${release_commit_sha}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR associated with release commit ${release_commit_sha}; skipping."
            exit 0
          fi

          PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || {
            echo "Failed to fetch PR details for #${PR_NUMBER}; skipping."
            exit 0
          }
          PR_HEAD_REF="$(echo "${PR_JSON}" | jq -r '.head.ref // empty')"
          PR_TITLE="$(echo "${PR_JSON}" | jq -r '.title // empty')"
          PR_BODY="$(echo "${PR_JSON}" | jq -r '.body // empty')"

          mapfile -t KEYS < <(
            {
              extract_keys "${PR_HEAD_REF}"
              extract_keys "${PR_TITLE}"
              extract_keys "${PR_BODY}"
            } | sort -u
          )

          if [ "${#KEYS[@]}" -eq 0 ]; then
            echo "No LMLO keys found in release-related PR #${PR_NUMBER}; skipping."
            exit 0
          fi

          COMMENT_BODY="Released: ${RELEASE_URL}"
          for key in "${KEYS[@]}"; do
            issue_json="$(linear_issue_by_identifier "$key")"
            issue_id="$(echo "$issue_json" | jq -r '.data.issue.id // empty')"
            if [ -z "$issue_id" ]; then
              echo "Issue ${key} not found in Linear; skipping."
              continue
            fi
            echo "Moving ${key} to Release."
            # Intentionally fail-fast if state/comment mutations fail.
            linear_update_state "$issue_id" "${LINEAR_STATE_RELEASE_ID}"
            linear_comment "$issue_id" "${COMMENT_BODY}"
          done

  failed-cicd-to-failed-ci:
    name: Failed CI/CD -> Failed CI
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Move issues to Failed CI
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not set; skipping."
            exit 0
          fi
          if [ -z "${LINEAR_STATE_FAILED_CI_ID:-}" ]; then
            echo "LINEAR_STATE_FAILED_CI_ID is not set."
            exit 1
          fi

          extract_keys() {
            local input="$1"
            if [ -z "$input" ]; then
              return 0
            fi
            printf "%s\n" "$input" \
              | (grep -oiE 'LMLO-[0-9]+' || true) \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          linear_issue_by_identifier() {
            local identifier="$1"
            local payload response issue_id error_count

            payload="$(jq -n --arg identifier "$identifier" '{query: "query($identifier: String!) { issue(identifier: $identifier) { id } }", variables: {identifier: $identifier}}')"
            response="$(
              curl -sS --fail-with-body https://api.linear.app/graphql \
                -H "Authorization: ${LINEAR_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$payload"
            )"
            if ! echo "$response" | jq -e . >/dev/null 2>&1; then
              echo "Linear returned invalid JSON for issue lookup: ${identifier}" >&2
              return 1
            fi
            error_count="$(echo "$response" | jq -r '.errors | length // 0')"
            if [ "${error_count}" != "0" ]; then
              echo "Linear lookup failed for ${identifier}." >&2
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' >&2 || true
              return 1
            fi
            issue_id="$(echo "$response" | jq -r '.data.issue.id // empty')"
            if [ -n "$issue_id" ]; then
              echo "$response"
              return 0
            fi
            echo "$response"
          }

          linear_update_state() {
            local issue_id="$1"
            local state_id="$2"
            local payload response success
            if [ -z "${state_id:-}" ]; then
              echo "State ID is empty for issue ${issue_id}."
              return 1
            fi
            payload="$(jq -n --arg issue_id "$issue_id" --arg state_id "$state_id" '{query: "mutation($issue_id: String!, $state_id: String!) { issueUpdate(id: $issue_id, input: { stateId: $state_id }) { success } }", variables: {issue_id: $issue_id, state_id: $state_id}}')"
            response="$(
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload"
            )"
            success="$(echo "$response" | jq -r '.data.issueUpdate.success // "false"')"
            if [ "$success" != "true" ]; then
              echo "Linear issueUpdate failed for ${issue_id}."
              echo "$response" | jq -r '.errors[]?.message' | sed 's/^/Linear error: /' || true
              return 1
            fi
          }

          PR_NUMBER="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR associated with failed run commit ${HEAD_SHA}; skipping."
            exit 0
          fi

          PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || {
            echo "Failed to fetch PR details for #${PR_NUMBER}; skipping."
            exit 0
          }
          PR_HEAD_REF="$(echo "${PR_JSON}" | jq -r '.head.ref // empty')"
          PR_TITLE="$(echo "${PR_JSON}" | jq -r '.title // empty')"
          PR_BODY="$(echo "${PR_JSON}" | jq -r '.body // empty')"

          mapfile -t KEYS < <(
            {
              extract_keys "${PR_HEAD_REF}"
              extract_keys "${PR_TITLE}"
              extract_keys "${PR_BODY}"
            } | sort -u
          )

          if [ "${#KEYS[@]}" -eq 0 ]; then
            echo "No LMLO keys found in failed-run PR #${PR_NUMBER}; skipping."
            exit 0
          fi

          for key in "${KEYS[@]}"; do
            issue_json="$(linear_issue_by_identifier "$key")"
            issue_id="$(echo "$issue_json" | jq -r '.data.issue.id // empty')"
            if [ -z "$issue_id" ]; then
              echo "Issue ${key} not found in Linear; skipping."
              continue
            fi
            echo "Moving ${key} to Failed CI."
            # Intentionally fail-fast if state mutation fails.
            linear_update_state "$issue_id" "${LINEAR_STATE_FAILED_CI_ID}"
          done
