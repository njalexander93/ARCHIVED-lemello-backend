name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-pr-title:
    name: Sync PR Title from Linear
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Sync title to [LMLO-###] Linear Issue Title
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -uo pipefail

          if [ "${PR_IS_DRAFT}" = "true" ]; then
            echo "Draft PR detected; title sync skipped."
            exit 0
          fi

          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY is not set; title sync skipped."
            exit 0
          fi

          extract_keys() {
            local input="$1"
            if [ -z "$input" ]; then
              return 0
            fi
            printf "%s\n" "$input" \
              | (grep -oiE 'LMLO-[0-9]+' || true) \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          }

          KEY_FROM_BRANCH="$(extract_keys "${PR_HEAD_REF}" | head -n1 || true)"
          if [ -n "${KEY_FROM_BRANCH}" ]; then
            ISSUE_KEY="${KEY_FROM_BRANCH}"
          else
            ISSUE_KEY="$(
              {
                extract_keys "${PR_TITLE}"
                extract_keys "${PR_BODY}"
              } | head -n1 || true
            )"
          fi

          if [ -z "${ISSUE_KEY}" ]; then
            echo "No LMLO issue key found; title sync skipped."
            exit 0
          fi

          ISSUE_QUERY="$(jq -n --arg identifier "${ISSUE_KEY}" '{query: "query($identifier: String!) { issue(identifier: $identifier) { title } }", variables: {identifier: $identifier}}')"
          ISSUE_RESPONSE="$(
            curl -sS https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "${ISSUE_QUERY}" || true
          )"
          ISSUE_TITLE="$(echo "${ISSUE_RESPONSE}" | jq -r '.data.issue.title // empty' 2>/dev/null || true)"
          if [ -z "${ISSUE_TITLE}" ]; then
            ISSUE_QUERY="$(jq -n --arg identifier "${ISSUE_KEY}" '{query: "query($identifier: String!) { issue(id: $identifier) { title } }", variables: {identifier: $identifier}}')"
            ISSUE_RESPONSE="$(
              curl -sS https://api.linear.app/graphql \
                -H "Authorization: ${LINEAR_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "${ISSUE_QUERY}" || true
            )"
            ISSUE_TITLE="$(echo "${ISSUE_RESPONSE}" | jq -r '.data.issue.title // empty' 2>/dev/null || true)"
          fi

          if [ -z "${ISSUE_TITLE}" ]; then
            echo "Could not resolve Linear issue title for ${ISSUE_KEY}; title sync skipped."
            exit 0
          fi

          DESIRED_TITLE="[${ISSUE_KEY}] ${ISSUE_TITLE}"
          if [ "${PR_TITLE}" = "${DESIRED_TITLE}" ]; then
            echo "PR title already matches desired format."
            exit 0
          fi

          echo "Updating PR title to: ${DESIRED_TITLE}"
          gh api \
            --method PATCH \
            "repos/${REPO}/pulls/${PR_NUMBER}" \
            -f title="${DESIRED_TITLE}" \
            >/dev/null || {
              echo "Failed to update PR title; continuing."
              exit 0
            }

  pr-title-check:
    name: PR Title Check
    needs: [sync-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          PR_TITLE="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title')"

          # Check format: [LMLO-XXX] Description
          if ! echo "$PR_TITLE" | grep -qE '^\[LMLO-[0-9]+\] .+'; then
            echo "❌ PR title must match format: [LMLO-XXX] Description"
            echo "   - Must start with [LMLO-XXX] where XXX is a number"
            echo "   - Must have space after closing bracket"
            echo "   - Must include a non-empty description"
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title format is valid"

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for required labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: "Bug, Documentation, Feature, Improvement, Spike, Task, Vulnerability"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-check:
    name: Duplicate Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Image-Impacting Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'uv.lock'

      - name: Get PR Version
        if: steps.filter.outputs.release_paths == 'true'
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check Duplicate Version
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ Release v$VERSION already exists!"
            echo ""
            echo "To bump the version:"
            echo "  1. Edit pyproject.toml line 3"
            echo "  2. Change version to next patch/minor/major"
            echo "  3. Commit: git commit -am 'Bump version to X.Y.Z'"
            echo ""
            echo "Version format: MAJOR.MINOR.PATCH"
            echo "  - PATCH (0.1.0 -> 0.1.1): Bug fixes"
            echo "  - MINOR (0.1.0 -> 0.2.0): New features (backward compatible)"
            echo "  - MAJOR (0.1.0 -> 1.0.0): Breaking changes"
            exit 1
          fi
          echo "✅ Version v$VERSION is unique"

      - name: Skip Version Check
        if: steps.filter.outputs.release_paths == 'false'
        run: |
          echo "✅ Non-release change - version check skipped"

  test-suite:
    name: Pre-Merge Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Image, Test, and Tooling Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'uv.lock'
            tooling_paths:
              - 'scripts/**'
              - '.github/workflows/pr-checks.yml'

      - name: Set up Python 3.14
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv sync --frozen --all-extras

      - name: Ruff Lint Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run ruff check app/ tests/

      - name: Ruff Format Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run ruff format --check app/ tests/

      - name: mypy Type Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run mypy app/

      - name: Unit Tests
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run pytest tests/unit/ -v

      - name: Integration Tests
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run pytest tests/integration/ -v

      - name: Skip Pre-Merge Checks
        if: steps.filter.outputs.release_paths == 'false' && steps.filter.outputs.tooling_paths == 'false'
        run: |
          echo "✅ Only non-impactful paths changed - pre-merge checks skipped"
