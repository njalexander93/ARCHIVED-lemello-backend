name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Check format: [LMLO-XXX] Description starting with capital
          if ! echo "$PR_TITLE" | grep -qE '^\[LMLO-[0-9]+\] [A-Z]'; then
            echo "❌ PR title must match format: [LMLO-XXX] Description"
            echo "   - Must start with [LMLO-XXX] where XXX is a number"
            echo "   - Must have space after closing bracket"
            echo "   - Description must start with capital letter"
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title format is valid"

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for required labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: "Bug, Documentation, Feature, Improvement, Spike, Task, Vulnerability"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version-check:
    name: Duplicate Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Image-Impacting Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'uv.lock'

      - name: Get PR Version
        if: steps.filter.outputs.release_paths == 'true'
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check Duplicate Version
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ Release v$VERSION already exists!"
            echo ""
            echo "To bump the version:"
            echo "  1. Edit pyproject.toml line 3"
            echo "  2. Change version to next patch/minor/major"
            echo "  3. Commit: git commit -am 'Bump version to X.Y.Z'"
            echo ""
            echo "Version format: MAJOR.MINOR.PATCH"
            echo "  - PATCH (0.1.0 -> 0.1.1): Bug fixes"
            echo "  - MINOR (0.1.0 -> 0.2.0): New features (backward compatible)"
            echo "  - MAJOR (0.1.0 -> 1.0.0): Breaking changes"
            exit 1
          fi
          echo "✅ Version v$VERSION is unique"

      - name: Skip Version Check
        if: steps.filter.outputs.release_paths == 'false'
        run: |
          echo "✅ Non-release change - version check skipped"

  test-suite:
    name: Pre-Merge Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Image, Test, and Tooling Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'uv.lock'
            tooling_paths:
              - 'scripts/**'
              - '.github/workflows/pr-checks.yml'

      - name: Set up Python 3.14
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv sync --frozen --all-extras

      - name: Ruff Lint Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run ruff check app/ tests/

      - name: Ruff Format Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run ruff format --check app/ tests/

      - name: mypy Type Check
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run mypy app/

      - name: Unit Tests
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run pytest tests/unit/ -v

      - name: Integration Tests
        if: steps.filter.outputs.release_paths == 'true' || steps.filter.outputs.tooling_paths == 'true'
        run: uv run pytest tests/integration/ -v

      - name: Skip Pre-Merge Checks
        if: steps.filter.outputs.release_paths == 'false' && steps.filter.outputs.tooling_paths == 'false'
        run: |
          echo "✅ Only non-impactful paths changed - pre-merge checks skipped"
