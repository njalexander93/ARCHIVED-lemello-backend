name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'uv.lock'

# Prevent concurrent releases - queue them instead
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # For creating releases and tags
  packages: write  # For pushing to GHCR

jobs:
  test:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Unit Tests
        run: uv run pytest tests/unit/ -v

      - name: Integration Tests
        run: uv run pytest tests/integration/ -v

      - name: E2E Tests
        run: uv run pytest tests/e2e/ -v

  build-and-release:
    name: Continuous Deployment
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for release-path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release_paths:
              - 'app/**'
              - 'pyproject.toml'
              - 'Dockerfile'
              - 'uv.lock'

      - name: Extract Version
        if: steps.filter.outputs.release_paths == 'true'
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Check Duplicate Version
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} &>/dev/null; then
            echo "❌ ERROR: Release v${{ steps.version.outputs.version }} already exists!"
            echo ""
            echo "This prevents Docker image/release version mismatch."
            echo "Please bump the version in pyproject.toml before merging."
            exit 1
          fi
          echo "✅ Version v${{ steps.version.outputs.version }} is unique"

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.release_paths == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.filter.outputs.release_paths == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/backend:latest

      - name: Create GitHub Release
        if: steps.filter.outputs.release_paths == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "## Release v${{ steps.version.outputs.version }}

            ### Docker Images
            \`\`\`
            docker pull ghcr.io/${{ github.repository_owner }}/backend:${{ steps.version.outputs.version }}
            \`\`\`

            ### Changes
            See commit history for details." \
            --repo ${{ github.repository }}

      - name: Skip deployment for test-only changes
        if: steps.filter.outputs.release_paths == 'false'
        run: echo "✅ No release-path changes detected; deployment skipped."
