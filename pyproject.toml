[project]
name = "lemello-backend"
version = "0.1.0"
description = "Core API and AI orchestration service for lemello, built with FastAPI. Handles recipe creation sessions, persistence, security, and integration with LLM providers."
authors = [
    {name = "Nikolai Alexander", email = "njalexander93@gmail.com"}
]
license = {text = "Copyright © Lemello, LLC. All rights reserved."}
readme = "README.md"
requires-python = ">=3.14,<4.0"

# Main dependencies
dependencies = [
    "fastapi>=0.128.0,<0.129.0",
    "uvicorn[standard]>=0.40.0,<0.41.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.14.14",
    "mypy>=1.19.1",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch build configuration (app is not a packaged library)
[tool.hatch.build.targets.wheel]
packages = ["app"]

# -------------------------
# Tooling configuration
# -------------------------

# Ruff (linting and formatting)
[tool.ruff]
line-length = 80
target-version = "py314"
fix = true

[tool.ruff.lint]
# - E/W : pycodestyle (PEP 8 formatting and whitespace rules)
# - F: pyflakes (logic/quality checks like unused imports, undefined names)
# - I: isort (import sorting and grouping)
# - D: pydocstyle (docstring conventions; set to "google" style)
# - G: flake8-logging-format (checks for lazy formatting in logging)
select = ["E", "W", "F", "I", "D", "G"]
ignore = ["D205", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# mypy (static type checking)
[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

# pytest (testing)
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test markers for categorization
markers = [
    "unit: Fast unit tests with no external dependencies",
    "integration: Integration tests with TestClient or external services",
    "e2e: End-to-end tests with full stack",
    "slow: Tests that take >1 second",
]

# Default: run all tests with coverage
addopts = "-ra --cov=app --cov-report=term-missing"
