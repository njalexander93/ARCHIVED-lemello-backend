name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Check format: [LMLO-XXX] Description starting with capital
          if ! echo "$PR_TITLE" | grep -qE '^\[LMLO-[0-9]+\] [A-Z]'; then
            echo "❌ PR title must match format: [LMLO-XXX] Description"
            echo "   - Must start with [LMLO-XXX] where XXX is a number"
            echo "   - Must have space after closing bracket"
            echo "   - Description must start with capital letter"
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi

          echo "✅ PR title format is valid"

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - name: Check for required labels
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: "Bug, Documentation, Feature, Improvement, Spike, Task, Vulnerability"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-suite:
    name: Lint, Type Check, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff linter
        run: uv run ruff check app/ tests/

      - name: Run Ruff formatter check
        run: uv run ruff format --check app/ tests/

      - name: Run mypy type checker
        run: uv run mypy app/

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --cov=app --cov-report=term
